
<script>
  // Paste your deployed Google Apps Script /exec URL here.
  const API_URL = "https://script.google.com/macros/s/AKfycbyvBBZWotfNwAg7BTP9Xs2yjy3OztSXYYhRpjkcBMn_C28xP5KKuCvb8h2gYy8Hru-y/exec
";

  const search = document.getElementById("search");
  const card = document.getElementById("wineCard");
  const message = document.getElementById("message");

  let wines = [];
  let requestNumber = 0;

  function loadWines() {
    const thisRequest = ++requestNumber;
    message.hidden = false;
    message.textContent = "Loading wine analysis...";

    const callback = "fratelliCallback" + thisRequest;

    window[callback] = function(data) {
      delete window[callback];

      if (thisRequest !== requestNumber) return;

      if (data && data.error) {
        card.hidden = true;
        message.hidden = false;
        message.textContent = "Sheet error: " + data.error;
        return;
      }

      if (!Array.isArray(data)) {
        card.hidden = true;
        message.hidden = false;
        message.textContent = "Unexpected data received.";
        return;
      }

      wines = data;
      findWine();
    };

    const script = document.createElement("script");
    script.src = API_URL + "?callback=" + callback +
      "&_=" + Date.now();

    script.onerror = function() {
      delete window[callback];
      if (thisRequest !== requestNumber) return;
      card.hidden = true;
      message.hidden = false;
      message.textContent =
        "Could not connect. Check the Apps Script URL and deployment.";
    };

    document.body.appendChild(script);
  }

  function findWine() {
    const query = search.value.trim().toLowerCase();

    if (!query) {
      card.hidden = true;
      message.hidden = false;
      message.textContent =
        "Enter a wine name or tank number to search.";
      return;
    }

    const matches = wines.filter(w =>
      String(w.name || "").toLowerCase().includes(query) ||
      String(w.tank || "").toLowerCase().includes(query)
    );

    if (matches.length === 0) {
      card.hidden = true;
      message.hidden = false;
      message.textContent = "No matching wine found.";
      return;
    }

    const w = matches[0];

    document.getElementById("wineName").textContent = w.name || "—";
    document.getElementById("tankNo").textContent = w.tank || "—";
    document.getElementById("wineType").textContent = w.type || "—";
    document.getElementById("ph").textContent = w.ph ?? "—";
    document.getElementById("ta").textContent = w.ta ?? "—";
    document.getElementById("alc").textContent = w.alc ?? "—";
    document.getElementById("fso2").textContent = w.fso2 ?? "—";
    document.getElementById("tso2").textContent = w.tso2 ?? "—";
    document.getElementById("analysisDate").textContent = w.date || "—";

    card.hidden = false;
    message.hidden = true;
  }

  search.addEventListener("input", findWine);

  // Fetch fresh sheet data every 60 seconds.
  loadWines();
  setInterval(loadWines, 60000);
</script>
